<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="testlensBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="testlensBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="testlensShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.06"/>
    </filter>
    <filter id="testlensShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="480" height="320" rx="14" fill="url(#testlensBg)"/>
  <!-- Header -->
  <rect x="20" y="16" width="440" height="44" rx="10" fill="white" filter="url(#testlensShadowSm)" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="32" y="28" width="88" height="10" rx="5" fill="#064E3B" opacity="0.75"/>
  <rect x="348" y="26" width="92" height="24" rx="12" fill="url(#testlensBtn)" filter="url(#testlensShadowSm)"/>
  <text x="372" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">View Report</text>
  <!-- Stats cards -->
  <rect x="20" y="72" width="132" height="60" rx="10" fill="white" filter="url(#testlensShadowSm)" stroke="#A7F3D0" stroke-width="1"/>
  <circle cx="52" cy="98" r="14" fill="#D1FAE5"/>
  <path d="M48 98 L51 101 L56 96" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#059669">24</text>
  <text x="76" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">passed</text>
  <rect x="164" y="72" width="132" height="60" rx="10" fill="white" filter="url(#testlensShadowSm)" stroke="#A7F3D0" stroke-width="1"/>
  <circle cx="196" cy="98" r="14" fill="#FEE2E2"/>
  <path d="M192 98 L200 98 M196 94 L196 102" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <text x="220" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#DC2626">2</text>
  <text x="220" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">failed</text>
  <rect x="308" y="72" width="152" height="60" rx="10" fill="white" filter="url(#testlensShadowSm)" stroke="#A7F3D0" stroke-width="1"/>
  <text x="324" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0D9488">92%</text>
  <text x="324" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">pass rate</text>
  <!-- Video card -->
  <rect x="20" y="144" width="212" height="120" rx="10" fill="white" filter="url(#testlensShadowSm)" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="32" y="156" width="188" height="80" rx="8" fill="#134E4A" opacity="0.12"/>
  <circle cx="126" cy="196" r="28" fill="#059669" opacity="0.95"/>
  <polygon points="118,188 118,204 134,196" fill="white"/>
  <rect x="32" y="248" width="72" height="8" rx="4" fill="#047857" opacity="0.9"/>
  <rect x="32" y="260" width="140" height="6" rx="3" fill="#D1FAE5"/>
  <!-- Chart card -->
  <rect x="244" y="144" width="216" height="120" rx="10" fill="white" filter="url(#testlensShadowSm)" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="256" y="156" width="192" height="72" rx="8" fill="#F0FDF4"/>
  <line x1="260" y1="218" x2="436" y2="218" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="268" y="206" width="20" height="12" rx="4" fill="#059669"/>
  <rect x="296" y="198" width="20" height="20" rx="4" fill="#059669"/>
  <rect x="324" y="186" width="20" height="32" rx="4" fill="#059669"/>
  <rect x="352" y="192" width="20" height="26" rx="4" fill="#DC2626"/>
  <rect x="380" y="200" width="20" height="18" rx="4" fill="#059669"/>
  <rect x="408" y="204" width="20" height="14" rx="4" fill="#059669"/>
  <rect x="256" y="240" width="64" height="8" rx="4" fill="#047857" opacity="0.9"/>
  <rect x="256" y="254" width="160" height="6" rx="3" fill="#A7F3D0"/>
  <!-- AI Insights bar -->
  <rect x="20" y="276" width="440" height="28" rx="8" fill="white" filter="url(#testlensShadowSm)" stroke="#6EE7B7" stroke-width="1"/>
  <rect x="32" y="284" width="24" height="24" rx="6" fill="url(#testlensBtn)"/>
  <text x="44" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">AI</text>
  <rect x="64" y="282" width="72" height="8" rx="4" fill="#064E3B" opacity="0.75"/>
  <rect x="64" y="294" width="360" height="6" rx="3" fill="#D1FAE5"/>
</svg>
